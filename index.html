<!DOCTYPE html>

<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Listino Prezzi</title>
<link rel="apple-touch-icon" href="logo.png"> 

<!-- Libreria per la lettura dei file Excel (.xlsx) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

body{

font-family:-apple-system,sans-serif;

margin:0;

background:#007AFF;

color:#333;

overflow-x:hidden;

}



/* SFONDO LOGO */

.bg-logo{

position:fixed;

top:50%;

left:50%;

transform:translate(-50%,-50%);

width:80%;

opacity:0.99; /* trasparenza */

z-index:0;

pointer-events:none;


}


/* HEADER */

.header{

padding:20px;

color:white;

text-align:center;

position:relative;

z-index:1;

}



.header h1{

margin:0;

font-size:24px;

}



/* SEARCH */

.search-box{

background:white;

margin:-20px 15px 10px;

padding:10px;

border-radius:20px;

box-shadow:0 10px 20px rgba(0,0,0,0.15);

position:relative;

z-index:1;

}



input{

width:100%;

padding:15px;

border:none;

outline:none;

font-size:18px;

border-radius:15px;

}



/* CONTENUTO */

.container{

padding:10px;

position:relative;

z-index:1;

}



.info{

color:white;

margin:10px;

font-size:14px;

position:relative;

z-index:1;

}



/* CARD */

.box{

background:white;

padding:15px;

border-radius:18px;

margin-bottom:12px;

box-shadow:0 6px 15px rgba(0,0,0,0.1);

transition:transform 0.1s;

}



.box:active{

transform:scale(0.97);

}



.cod{

font-size:18px !important;
font-weight: 800 !important;


color:#000 !important;
display: block;
margin-bottom: 5px;
}



.nome{

font-weight:600;

margin:6px 0;

}



.prezzo{

color:#007AFF;

font-size:18px;

font-weight:bold;

}



.highlight{

background:#ffe066;

border-radius:4px;

padding:2px;

}



.vuoto{

text-align:center;

color:white;

margin-top:40px;

}



</style>

</head>



<body>



<!-- LOGO SFONDO -->

<img src="logo.png" class="bg-logo">



<div class="header">

<h1>🔎 Trova Prezzi</h1>

</div>



<div class="search-box">

<input type="text" id="campo" placeholder="Cerca prodotto..." oninput="cerca()">

</div>



<div class="info" id="info">Caricamento listino...</div>



<div class="container" id="lista"></div>



<script>

let prodotti = [];

// Caricamento del file listino.xlsx caricato nel repository
async function caricaListinoDaExcel() {
  let info = document.getElementById('info');
  try {
    const response = await fetch('listino.xlsx?v=' + new Date().getTime());
    if (!response.ok) throw new Error('File non trovato');

    const arrayBuffer = await response.arrayBuffer();
    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

    prodotti = [];

    rows.forEach((row, index) => {
      if (!row || row.length === 0) return;

      const c = String(row[0] || '').trim();
      const n = String(row[1] || '').trim();
      let pr = row[2] !== undefined ? String(row[2]).trim() : '';

      // Ignora l'eventuale riga d'intestazione
      if (index === 0 && c.toLowerCase().includes('codic')) return;

      if (c || n) {
        prodotti.push({ c, n, pr });
      }
    });

    info.innerHTML = "";
  } catch (error) {
    info.innerHTML = "Errore: carica il file 'listino.xlsx' nel repository.";
  }
}

// Esegue il caricamento appena si apre la pagina
caricaListinoDaExcel();


function evidenzia(testo, ricerca){

if(!ricerca) return testo;

let reg = new RegExp(`(${ricerca})`, "gi");

return testo.replace(reg, '<span class="highlight">$1</span>');

}



function cerca(){



let val = document.getElementById('campo').value.toLowerCase();

let lista = document.getElementById('lista');

let info = document.getElementById('info');



lista.innerHTML="";



if(val.length<2){

info.innerHTML="";

return;

}



let risultati = prodotti.filter(p =>

p.c.toLowerCase().includes(val) ||

p.n.toLowerCase().includes(val)

);



info.innerHTML = risultati.length + " risultati";



if(risultati.length===0){

lista.innerHTML = `<div class="vuoto">Nessun risultato</div>`;

return;

}



risultati.slice(0,100).forEach(p=>{



lista.innerHTML += `

<div class="box">

<div class="cod">${p.c}</div>

<div class="nome">${evidenzia(p.n,val)}</div>

<div class="prezzo">€ ${p.pr}</div>

</div>

`;



});



}



</script>



</body>

</html>
